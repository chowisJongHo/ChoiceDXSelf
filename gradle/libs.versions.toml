[versions]
agp = "8.6.0"
kotlin = "1.9.24"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.9.3"
constraintlayout = "2.2.1"

navigation = "2.7.5"
hilt = "2.51.1"
autoScale = "1.0.6"
timber = "4.7.1"
lottie = "6.4.0"
blurView = "version-2.0.3"
glide = "4.16.0"
kotpref = "2.13.2"
security = "1.1.0-alpha06"

# Retrofit
retrofit = "2.9.0"
coroutines = "1.7.3"
logging-interceptor = "4.12.0"

# NewCND SDK
exoplayer = "1.3.1"
navigationFragmentKtx = "2.9.3"
navigationUiKtx = "2.9.3"

#AI
tensorflow = "2.14.0"
onnxruntime = "1.17.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

navigation-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation"}
navigation-ui = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
hilt = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt"}
sdp = { group = "com.intuit.sdp", name = "sdp-android", version.ref = "autoScale"}
ssp = { group = "com.intuit.ssp", name = "ssp-android", version.ref = "autoScale"}
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber"}
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie"}
blurview = { group = "com.github.Dimezis", name = "BlurView", version.ref = "blurView" }
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide"}
kotpref = { group = "com.chibatching.kotpref", name = "kotpref", version.ref = "kotpref" }
security = { group = "androidx.security", name = "security-crypto", version.ref = "security" }

# Retrofit
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
converter = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "logging-interceptor"}

# NewCND SDK
exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "exoplayer"}
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragmentKtx" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationUiKtx" }


# AI
tensorflow = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tensorflow"}
onnxruntime = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime"}

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
args = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }
